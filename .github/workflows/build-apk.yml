name: Bygg Sions Sånger APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'Sions_Sanger_Android_Officiell_Build_1.2.zip'
      - 'tv/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4

      - name: Packa upp Android-källkoden
        shell: bash
        run: |
          test -s Sions_Sanger_Android_Officiell_Build_1.2.zip
          mkdir -p android-source
          unzip -q Sions_Sanger_Android_Officiell_Build_1.2.zip -d android-source

      - name: Installera Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installera Android SDK
        uses: android-actions/setup-android@v4

      - name: Installera Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Återställ permanent signeringsnyckel
        env:
          SIONS_SIGNING_KEY_B64: ${{ secrets.SIONS_SIGNING_KEY_B64 }}
        shell: bash
        run: |
          python3 - <<'PYKEY'
          import os, base64, pathlib
          value = os.environ.get('SIONS_SIGNING_KEY_B64', '').strip()
          if not value:
              raise SystemExit('Missing SIONS_SIGNING_KEY_B64 secret. Refusing to generate a replacement signing key.')
          path = pathlib.Path('android-source/sions-signing.p12')
          path.write_bytes(base64.b64decode(value, validate=True))
          path.chmod(0o600)
          PYKEY
          keytool -exportcert -keystore android-source/sions-signing.p12 -storetype PKCS12 -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/sions-cert.der"
          echo "dd65ba4802942445bee1227499ee895f193e57834846f85d8dff92f8ef16c5c9  $RUNNER_TEMP/sions-cert.der" | sha256sum --check --status

      - name: Installera Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Lägg till TV-läge utan att ändra sångerna
        run: python3 tv/integrate.py android-source

      - name: Paketera öppen MusicXML-renderare för offlinebruk
        shell: bash
        run: |
          PACKAGE_DIR="$RUNNER_TEMP/sions-osmd"
          mkdir -p "$PACKAGE_DIR"
          npm pack opensheetmusicdisplay@1.9.9 --pack-destination "$PACKAGE_DIR" --silent
          BUNDLE="$PACKAGE_DIR/opensheetmusicdisplay-1.9.9.tgz"
          test -s "$BUNDLE"
          tar -xOf "$BUNDLE" package/build/opensheetmusicdisplay.min.js > android-source/app/src/main/assets/opensheetmusicdisplay.min.js
          test -s android-source/app/src/main/assets/opensheetmusicdisplay.min.js
          cp tv/OSMD-LICENSE.txt android-source/app/src/main/assets/OSMD-LICENSE.txt

      - name: Kontrollera färgval, kontrast och sparade inställningar
        run: |
          npm install --prefix "$RUNNER_TEMP/sions-colour-tests" --no-save --ignore-scripts --no-audit --no-fund jsdom@26.1.0
          CHROME_PATH="$(command -v google-chrome || command -v chromium || true)" SIONS_PREVIEW_DIR="$RUNNER_TEMP/sions-colour-previews" NODE_PATH="$RUNNER_TEMP/sions-colour-tests/node_modules" node tv/appearance.test.cjs
          NODE_PATH="$RUNNER_TEMP/sions-colour-tests/node_modules" node tv/empty-library.test.cjs
          NODE_PATH="$RUNNER_TEMP/sions-colour-tests/node_modules" node tv/smart-import.test.cjs
          node tv/backup.test.cjs
          NODE_PATH="$RUNNER_TEMP/sions-colour-tests/node_modules" node tv/score-viewer.test.cjs

      - name: Spara granskning av färgvyer
        uses: actions/upload-artifact@v4
        with:
          name: Sions-Colour-Previews
          path: ${{ runner.temp }}/sions-colour-previews/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Använd fast signering och stigande versionsnummer
        env:
          SIONS_VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PYCONFIG'
          import os, pathlib
          path = pathlib.Path('android-source/app/build.gradle')
          code = 1000 + int(os.environ['SIONS_VERSION_CODE'])
          with path.open('a') as f:
              f.write("\nandroid { signingConfigs { debug { storeFile rootProject.file('sions-signing.p12'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android'; storeType 'PKCS12' } }; defaultConfig { versionCode " + str(code) + " } }\n")
          PYCONFIG

      - name: Bygg APK för befintlig app
        run: |
          gradle -p android-source --no-daemon :app:assembleDebug
          test -s android-source/app/build/outputs/apk/debug/app-debug.apk
          cp android-source/app/build/outputs/apk/debug/app-debug.apk Sions-Sanger-v1.20.apk

      - name: Skapa separat installerbar TV-app
        run: python3 tv/create_separate_tv_app.py android-source

      - name: Bygg separat TV-APK
        run: |
          gradle -p android-source --no-daemon :app:assembleDebug
          test -s android-source/app/build/outputs/apk/debug/app-debug.apk
          cp android-source/app/build/outputs/apk/debug/app-debug.apk Sions-Sanger-TV-v1.20.apk

      - name: Verifiera signering och separata paket-id
        shell: bash
        run: |
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s Sions-Sanger-v1.20.apk
          test -s Sions-Sanger-TV-v1.20.apk
          "$SIGNER" verify --verbose --print-certs Sions-Sanger-v1.20.apk
          "$SIGNER" verify --verbose --print-certs Sions-Sanger-TV-v1.20.apk
          "$AAPT" dump badging Sions-Sanger-v1.20.apk | grep -F "package: name='se.sionssanger.app'"
          "$AAPT" dump badging Sions-Sanger-TV-v1.20.apk | grep -F "package: name='se.sionssanger.tv'"
          for APK in Sions-Sanger-v1.20.apk Sions-Sanger-TV-v1.20.apk; do
            "$SIGNER" verify --print-certs "$APK" | grep -F 'Signer #1 certificate SHA-256 digest: dd65ba4802942445bee1227499ee895f193e57834846f85d8dff92f8ef16c5c9'
          done
          ls -lh Sions-Sanger*.apk

      - name: Ladda upp APK-filer för installation
        uses: actions/upload-artifact@v4
        with:
          name: Sions-Sanger-TV-v1.20-Bygge-${{ github.run_number }}
          path: |
            Sions-Sanger-TV-v1.20.apk
            Sions-Sanger-v1.20.apk
          if-no-files-found: error

