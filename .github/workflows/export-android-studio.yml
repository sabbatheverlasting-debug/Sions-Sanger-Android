name: Exportera komplett Android Studio-projekt

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-android-studio.yml'
      - 'Sions_Sanger_Android_Officiell_Build_1.2.zip'
      - 'tv/**'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta projekt
        uses: actions/checkout@v4
      - name: Packa upp Android-projekt
        shell: bash
        run: |
          mkdir -p android-source
          unzip -q Sions_Sanger_Android_Officiell_Build_1.2.zip -d android-source
          test -f android-source/settings.gradle || test -f android-source/settings.gradle.kts
          test -f android-source/app/build.gradle || test -f android-source/app/build.gradle.kts
      - name: Integrera senaste mobil- och TV-förbättringarna
        run: python3 tv/integrate.py android-source
      - name: Separera Android Studio-testapp från installerad originalapp
        shell: bash
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          from xml.sax.saxutils import escape

          gradle = Path('android-source/app/build.gradle')
          text = gradle.read_text(encoding='utf-8')
          assert "applicationId 'se.sionssanger.app'" in text, 'Fel grundpaket – avbryter'
          assert 'buildTypes {' not in text, 'Byggvarianter finns redan – kontroll krävs'
          marker = '    compileOptions {'
          assert text.count(marker) == 1
          patch = [
              "    // Separate debug test app: safe beside original Sions Sånger.",
              "    buildTypes {",
              "        debug {",
              "            applicationIdSuffix '.test'",
              "            versionNameSuffix '-TEST'",
              "        }",
              "    }",
          ]
          text = text.replace(marker, '\n'.join(patch) + '\n' + marker, 1)
          gradle.write_text(text, encoding='utf-8')

          manifest = Path('android-source/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text(encoding='utf-8')
          assert xml.count('android:label="Sions Sånger"') == 1
          manifest.write_text(xml.replace('android:label="Sions Sånger"',
                                          'android:label="@string/app_name"', 1), encoding='utf-8')
          for variant, label in [('main', 'Sions Sånger'), ('debug', 'Sions Sånger TEST')]:
              filename = Path('android-source/app/src') / variant / 'res/values/strings.xml'
              filename.parent.mkdir(parents=True, exist_ok=True)
              filename.write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<resources><string name="app_name">' + escape(label) +
                  '</string></resources>\n', encoding='utf-8')
          PYTEST
      - name: Kontrollera att Gradle och testpaketet är korrekt
        shell: bash
        run: |
          python3 - <<'PYCHECK'
          from pathlib import Path
          s=Path('android-source/app/build.gradle').read_text(encoding='utf-8')
          assert "\\n" not in s, 'Felaktiga bokstavliga radbrytningar i Gradle-filen'
          assert "buildTypes {" in s and "applicationIdSuffix '.test'" in s
          assert "// Separate debug test app:" in s
          assert s.count("{")==s.count("}"), 'Obalanserade klamrar'
          print('PASS: Gradle-syntax och separat test-app kontrollerade')
          PYCHECK
      - name: Paketera öppen MusicXML-renderare för offlinebruk
        shell: bash
        run: |
          PACKAGE_DIR="$RUNNER_TEMP/sions-osmd"
          mkdir -p "$PACKAGE_DIR"
          npm pack opensheetmusicdisplay@1.9.9 --pack-destination "$PACKAGE_DIR" --silent
          BUNDLE="$PACKAGE_DIR/opensheetmusicdisplay-1.9.9.tgz"
          test -s "$BUNDLE"
          tar -xOf "$BUNDLE" package/build/opensheetmusicdisplay.min.js > android-source/app/src/main/assets/opensheetmusicdisplay.min.js
          test -s android-source/app/src/main/assets/opensheetmusicdisplay.min.js
          cp tv/OSMD-LICENSE.txt android-source/app/src/main/assets/OSMD-LICENSE.txt

      - name: Installera Java 17 för verkligt Android-bygge
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installera Android SDK
        uses: android-actions/setup-android@v4
      - name: Installera Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Installera Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Kontrollera att Android Studio-testappen verkligen går att bygga
        run: |
          gradle -p android-source --no-daemon :app:assembleDebug
          test -s android-source/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android-source/app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='se.sionssanger.app.test'"
      - name: Skapa läsanvisning
        shell: bash
        run: |
          cat > android-source/README-ANDROID-STUDIO.md <<'EOF'
          # Sions Sånger — Android Studio
          
          Detta projekt utgår från det officiella Android-underlaget och har de senaste ändringarna från tv/integrate.py inlagda.
          
          1. Packa upp ZIP-filen.
          2. Starta Android Studio och välj **Open**.
          3. Välj den uppackade mappen där settings.gradle finns.
          4. Låt Gradle Sync slutföras och installera föreslagen Android SDK vid behov.
          5. Välj byggvariant **debug** (paket-id \`se.sionssanger.app.test\`), därefter **Run** för att testa på telefon.
          6. Den separata testappen heter **Sions Sånger TEST** och påverkar inte redan installerade sånger i den vanliga appen.
          
          Om Android Studio föreslår att avinstallera Sions Sånger ska du trycka **Cancel**, inte OK. Öppna detta testprojekt i en NY mapp.
          
          För publicering: skapa en **release AAB** med egen säker signering via Android Studio > Build > Generate Signed Bundle / APK. Håll keystore och lösenord privata. Kontrollera appens paket-id, versionCode, innehållsrättigheter och Play Console-krav innan uppladdning.
          
          Den separata TV-appen är en egen byggvariant som skapas via GitHubs ursprungliga TV-byggsteg; den ingår inte som ett separat Android Studio-projekt i denna export.
          EOF
      - name: Ta bort tillfälliga och hemliga filer
        run: |
          find android-source -type f \( -name '*.keystore' -o -name '*.jks' -o -name '*.p12' -o -name 'local.properties' \) -delete
      - name: Arkivera ett öppningsbart Android Studio-projekt
        run: |
          cd android-source
          zip -q -r ../Sions-Sanger-Android-Studio.zip . -x '*/build/*' '*/.gradle/*' '*/.idea/*'
          cd ..
          unzip -tq Sions-Sanger-Android-Studio.zip
      - name: Publicera ZIP som GitHub-artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sions-Sanger-Android-Studio
          path: Sions-Sanger-Android-Studio.zip
          if-no-files-found: error
          retention-days: 90
