name: Sions Sanger 1.24 Play update
on:
  push:
    branches: [release/warm-icon-1.24]
    paths: ['Sions-Sanger-1.24-Source.zip', '.github/workflows/play-icon-release.yml']
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Sions-Sanger-1.24-Source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore and verify existing signing certificate
        env:
          SIONS_SIGNING_KEY_B64: ${{ secrets.SIONS_SIGNING_KEY_B64 }}
        run: |
          python3 - <<'PY'
          import os,base64,pathlib
          data=os.environ.get('SIONS_SIGNING_KEY_B64','').strip()
          if not data: raise SystemExit('Missing existing signing key')
          p=pathlib.Path('play-release/sions-signing.p12')
          p.write_bytes(base64.b64decode(data,validate=True))
          p.chmod(0o600)
          PY
          keytool -exportcert -keystore play-release/sions-signing.p12 -storetype PKCS12 -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/sions-cert.der"
          echo "dd65ba4802942445bee1227499ee895f193e57834846f85d8dff92f8ef16c5c9  $RUNNER_TEMP/sions-cert.der" | sha256sum --check --status
      - name: Build signed release AAB and APK
        run: gradle -p play-release --no-daemon :app:bundleRelease :app:assembleRelease
      - name: Verify release identity and signing
        run: |
          APK=play-release/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | grep -F 'Signer #1 certificate SHA-256 digest: dd65ba4802942445bee1227499ee895f193e57834846f85d8dff92f8ef16c5c9'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='se.sionssanger.app' versionCode='200007' versionName='1.24'"
          jarsigner -verify play-release/app/build/outputs/bundle/release/app-release.aab
          cp "$APK" Sions-Sanger-1.24.apk
          cp play-release/app/build/outputs/bundle/release/app-release.aab Sions-Sanger-1.24.aab
          cp play-release/app/src/main/assets/assets/icon-512.png Sions-Sanger-Play-Icon-512.png
      - uses: actions/upload-artifact@v4
        with:
          name: Sions-Sanger-1.24-Play
          path: |
            Sions-Sanger-1.24.aab
            Sions-Sanger-1.24.apk
            Sions-Sanger-Play-Icon-512.png
          if-no-files-found: error
